<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | People Aren't Users</title>
<meta name="robots" content="noindex">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="8" fill="%23191512"/><text x="32" y="44" font-family="Georgia,serif" font-size="38" fill="%23f7f3ec" text-anchor="middle">u</text><line x1="12" y1="34" x2="52" y2="30" stroke="%23e05c3a" stroke-width="5" stroke-linecap="round"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f7f3ec;--ink:#191512;--muted:#6f6459;--accent:#b3361c}
  @media (prefers-color-scheme: dark){
    :root{--paper:#16130f;--ink:#ece5da;--muted:#a3968a;--accent:#e05c3a}
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    font-family:"Fraunces",Georgia,serif;padding:24px;
  }
  .box{max-width:560px}
  .code{font-family:"IBM Plex Mono",monospace;font-size:.8rem;letter-spacing:.14em;color:var(--muted);margin-bottom:22px}
  h1{font-weight:500;font-size:clamp(2rem,6vw,3.2rem);line-height:1.15;letter-spacing:-.01em}
  p{margin-top:18px;font-size:1.15rem;line-height:1.6;color:var(--muted)}
  a.btn{
    display:inline-block;margin-top:34px;font-family:"IBM Plex Mono",monospace;font-size:.85rem;
    padding:13px 22px;border-radius:3px;text-decoration:none;
    background:var(--ink);color:var(--paper);
  }
  a.btn:hover{background:var(--accent)}
</style>
</head>
<body>
  <main class="box">
    <p class="code">404 / NOT FOUND</p>
    <h1>This page does not exist.</h1>
    <p>You, on the other hand, do. The page you wanted was moved, mistyped, or never built. Nobody will make you wait seventeen minutes to find out which.</p>
    <a class="btn" href="/">Back to the book</a>
  </main>
</body>
</html>
